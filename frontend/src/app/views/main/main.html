<section class="main">
  <div class="container">
    <div class="main-banners">
      <owl-carousel-o [options]="customOptions" #owlCar>
        @for (banner of banners; track banner.id) {
          <ng-template carouselSlide>
            <div class="main-items">
              <div class="main-cover-bg">
                <img src="./images/pages/main/main-bg.png" alt="Фон">
              </div>
              <div class="main-item">
                <div class="main-category">
                  {{ banner.category }}
                </div>
                <div class="main-title">
                  @for (item of banner.title; track $index) {
                    @if (item.accent) {
                      <span>{{ item.text}}</span>
                    } @else {
                      {{ item.text }}
                    }
                  }
                </div>
                @if (banner.text) {
                  <div class="main-text">
                    {{ banner.text }}
                  </div>
                }
                <button class="button">Подробнее</button>
              </div>
              <div class="main-banner">
                <img src="{{ banner.image }}" alt="{{ banner.imageDesc }}">
              </div>
            </div>
          </ng-template>
        }
      </owl-carousel-o>
    </div>
  </div>
</section>
